{%- comment -%} theme= tells the embed's CSS (the minimal head on Dandelion) which of our themes it's shown in {%- endcomment -%}
<iframe style="overflow: scroll; border: 0; height: 100vh; width: 100%;" id="{{ include.id }}"></iframe>
<script>
  document.getElementById('{{ include.id }}').src = '{{ include.src }}&theme=' + window.theme
  $(function () {
    $('#{{ include.id }}').iFrameResize({ checkOrigin: false, heightCalculationMethod: 'taggedElement' })
    document.addEventListener('themechange', function (e) {
      const iframe = document.getElementById('{{ include.id }}')
      iframe.src = iframe.src.replace(/theme=\w+/, `theme=${e.detail}`)
    })
  })
</script>
