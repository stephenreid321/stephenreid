{%- comment -%} theme= tells the embed's CSS (the minimal head on Dandelion) which of our themes it's shown in, and theme_color=
gives it that theme's primary colour, for its badges and buttons {%- endcomment -%}
<iframe style="overflow: scroll; border: 0; height: 100vh; width: 100%;" id="{{ include.id }}"></iframe>
<script>
  (function () {
    const iframe = document.getElementById('{{ include.id }}')
    const src = function () {
      const primary = getComputedStyle(document.documentElement).getPropertyValue('--bs-primary').trim()
      return '{{ include.src }}&theme=' + window.theme + '&theme_color=' + encodeURIComponent(primary)
    }
    iframe.src = src()
    $(function () {
      $(iframe).iFrameResize({ checkOrigin: false, heightCalculationMethod: 'taggedElement' })
      document.addEventListener('themechange', function () {
        iframe.src = src()
      })
    })
  })()
</script>
