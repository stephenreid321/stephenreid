<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>

    <div class="mb-4">
      {% include nav.html %}
    </div>

    <div class="{{ page.container_class | default: 'container' }}">
      {{ content }}
    </div>

    <div id="footer" class="p-3 mt-3">
      <div class="container">
        {% unless page.hide_subscribe %}
          <div class="row justify-content-center mb-3">
            <div class="col-lg-auto text-center">
              <a target="_blank" class="btn btn-primary" href="https://stephenreid.substack.com/">Subscribe on Substack</a>
            </div>
          </div>
        {% endunless %}
        <div class="row justify-content-center">
          {% include social_networks.html %}
        </div>
        <div class="text-center mt-3">
          <i class="bi bi-github"></i>
          <a class="text-muted" target="_blank" href="https://github.com/stephenreid321/stephenreid">View source</a>
        </div>
      </div>
    </div>

    {% unless page.no_modal %}
      <script>
        $(function () {
          // ?no_modal=1: for the screenshots of pages that are their og:image
          if (!Cookies.get('shownModal') && !new URLSearchParams(location.search).has('no_modal')) {
            setTimeout(function () {
              $('#modal').modal('show')
              Cookies.set('shownModal', true, {expires: 90})
            }, 5000)
          }
        })
      </script>
    {% endunless %}

    <div class="modal fade" tabindex="-1" role="dialog" id="modal">
      <div class="modal-dialog modal-lg" role="document">
        <div class="modal-content">
          <div class="modal-body" style="background: #F9F9F8; border-radius: 5px;">
            <p class="lead mt-3 text-center">
              Join 3000+ others receiving my regular newsletter:
            </p>
            <iframe width="100%" height="200" src="https://stephenreid.substack.com/embed" frameborder="0" scrolling="no"></iframe>
          </div>
        </div>
        <!-- /.modal-content -->
      </div>
      <!-- /.modal-dialog -->
    </div>
    <!-- /.modal -->
  </body>
</html>
