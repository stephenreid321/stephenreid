name: Post the Readwise links to Bluesky, Semble and the blyg

# The Cloudflare Worker in cloudflare/ starts it every three hours, as GitHub's own schedule starts runs late or not
# at all
on:
  workflow_dispatch:

permissions: {}

jobs:
  # Posts to Bluesky the links archived in Readwise in the last week that aren't on Bluesky yet
  bluesky:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: $/.github/actions/setup-ruby

    - name: Post to Bluesky
      run: bundle exec rake bluesky:post
      env:
        READWISE_ACCESS_TOKEN: ${{ secrets.READWISE_ACCESS_TOKEN }}
        BLUESKY_EMAIL: ${{ secrets.BLUESKY_EMAIL }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}

  # Adds to Semble (semble.so) the links archived in Readwise in the last week that aren't among its cards yet, as cards
  # on the Bluesky account, which Semble reads from the firehose
  semble:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: $/.github/actions/setup-ruby

    - name: Add to Semble
      run: bundle exec rake semble:post
      env:
        READWISE_ACCESS_TOKEN: ${{ secrets.READWISE_ACCESS_TOKEN }}
        BLUESKY_EMAIL: ${{ secrets.BLUESKY_EMAIL }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}

  # Publishes to the blyg (blyg.stephenreid.net) the links archived in Readwise in the last week since the newest on it.
  # Its own job, so either can fail without holding up the other. BLYG_ACCESS_TOKEN expires after 30 days
  blyg:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: $/.github/actions/setup-ruby

    - name: Post to the blyg
      run: bundle exec rake blyg:post
      env:
        READWISE_ACCESS_TOKEN: ${{ secrets.READWISE_ACCESS_TOKEN }}
        BLYG_ACCESS_TOKEN: ${{ secrets.BLYG_ACCESS_TOKEN }}
