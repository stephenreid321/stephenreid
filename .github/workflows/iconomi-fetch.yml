name: Fetch from ICONOMI

# ICONOMI's strategies and Metastrategy: fetches them into data/fetched/iconomi.json, saves that to the Actions cache,
# where `site.yml` restores it from, keeps the issue about new strategies and assets, and rebuilds the site. The
# Cloudflare Worker in cloudflare/ starts it every three hours, as GitHub's own schedule starts runs late or not at all
on:
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # For the issue about new strategies and assets
      issues: write
      # To rebuild the site
      actions: write
    concurrency:
      group: iconomi-fetch
      cancel-in-progress: false
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: $/.github/actions/setup-ruby

    # As the last run saved them, which the fetch reads
    - name: Restore the strategies
      uses: $/.github/actions/fetched
      with:
        cache: iconomi

    - name: Fetch from ICONOMI
      run: bundle exec rake data:iconomi
      env:
        ICN_API_KEY: ${{ secrets.ICN_API_KEY }}
        ICN_SECRET: ${{ secrets.ICN_SECRET }}

    - name: Save the strategies
      uses: $/.github/actions/fetched
      with:
        cache: iconomi
        save: true

    # One open issue (label iconomi-new) while there are strategies or assets with no status yet: opened when the first
    # appears, commented on when the list changes, which notifies, and closed when none is left
    - name: Open or close the issue for new strategies and assets
      run: |
        body=$(bundle exec rake iconomi:unreviewed)
        number=$(gh issue list --state open --label iconomi-new --json number --jq '.[0].number // empty')
        if [ -n "$body" ] && [ -z "$number" ]; then
          gh issue create --label iconomi-new --title 'New ICONOMI strategies or assets to review' --body "$body"
        elif [ -n "$body" ] && [ "$body" != "$(gh issue view "$number" --json body --jq .body)" ]; then
          gh issue edit "$number" --body "$body"
          gh issue comment "$number" --body "The list has changed:"$'\n\n'"$body"
        elif [ -z "$body" ] && [ -n "$number" ]; then
          gh issue close "$number" --comment 'Every strategy and asset has a status now.'
        fi
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}

    - name: Rebuild the site
      uses: $/.github/actions/rebuild-site
