name: Build and deploy the site

# Builds the site and deploys it to GitHub Pages: on each push to master, and when a workflow that fetches data has saved
# it (`iconomi-fetch.yml`, `public-fetch.yml`, `substack.yml`, `substack-surfacer.yml`) or committed it (`goodreads.yml`).
# It fetches nothing itself, so it's quick: it builds from what those last saved to the Actions cache
on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions: {}

# One build at a time: a new one cancels the one running, as it builds from newer commits and data. A deploy cancelled
# halfway leaves the last one live
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        # For when data/goodreads_library_export.csv was last committed, which /books shows
        fetch-depth: 0

    - name: Install Ruby
      uses: $/.github/actions/setup-ruby

    # Each cache as the workflow that fetches it last saved it.
    # Restoring them on each build keeps GitHub from evicting them, as it does a cache unused for a week

    # ICONOMI's strategies, as `iconomi-fetch.yml` last saved them
    - name: Restore the strategies
      uses: $/.github/actions/fetched
      with:
        cache: iconomi

    # The places and the courses' notes, as `public-fetch.yml` last saved them
    - name: Restore the places and the courses' notes
      uses: $/.github/actions/fetched
      with:
        cache: public

    # Substack's notes and posts, as `substack.yml` last saved them (on Stephen's Mac, as Substack turns away GitHub's
    # runners)
    - name: Restore Substack's notes and posts
      uses: $/.github/actions/fetched
      with:
        cache: substack

    # The newsletters' posts for /substack, as `substack-surfacer.yml` last saved them (on Stephen's Mac too)
    - name: Restore the newsletters' posts
      uses: $/.github/actions/fetched
      with:
        cache: surfacer

    - name: Build the site
      run: bundle exec jekyll build
      env:
        JEKYLL_ENV: production
        APIFLASH_KEY: ${{ secrets.APIFLASH_KEY }}
        NUMBER_OF_ASSETS: ${{ vars.NUMBER_OF_ASSETS }}

    - name: Upload the site
      uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
