name: Verify the new ICONOMI strategies and assets

# Run by hand (Run workflow), when the site's issue lists strategies and assets with no status yet
on:
  workflow_dispatch:

permissions: {}

jobs:
  # Marks the strategies and assets with no status as verified, as the old admin page's Verify did, commits that to
  # master, and runs `iconomi-fetch.yml`, which closes the issue listing them and rebuilds the site
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: $/.github/actions/setup-ruby

    - name: Fetch from ICONOMI
      run: bundle exec rake data:iconomi
      env:
        ICN_API_KEY: ${{ secrets.ICN_API_KEY }}
        ICN_SECRET: ${{ secrets.ICN_SECRET }}

    - name: Verify
      run: bundle exec rake iconomi:verify

    # `iconomi-fetch.yml` rebuilds the site, and closes the issue first
    - name: Commit, close the issue and rebuild the site
      uses: $/.github/actions/commit
      with:
        paths: data/iconomi/strategies.csv data/iconomi/assets.csv
        message: Verify the new ICONOMI strategies and assets
        then: iconomi-fetch.yml
