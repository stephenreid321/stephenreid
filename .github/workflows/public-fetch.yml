name: Fetch the places and the courses' notes

# The places on the treasure map and the courses' notes, which need no keys: fetches them into data/fetched, saves them
# to the Actions cache, where `site.yml` restores them from, and, if they've changed, rebuilds the site. The Cloudflare
# Worker in cloudflare/ starts it every three hours, as GitHub's own schedule starts runs late or not at all
on:
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To rebuild the site
      actions: write
    concurrency:
      group: public-fetch
      cancel-in-progress: false
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: $/.github/actions/setup-ruby

    # As the last run saved them, to compare with what's fetched
    - name: Restore the places and the courses' notes
      id: cache
      uses: $/.github/actions/fetched
      with:
        cache: public

    - name: Fetch the places and the courses' notes
      id: fetch
      run: |
        before=$(cat $PATHS 2>/dev/null | shasum)
        bundle exec rake data:public
        after=$(cat $PATHS | shasum)
        if [ "$before" != "$after" ]; then echo changed=true >> "$GITHUB_OUTPUT"; fi
      env:
        PATHS: ${{ steps.cache.outputs.paths }}

    - name: Save the places and the courses' notes
      if: steps.fetch.outputs.changed == 'true'
      uses: $/.github/actions/fetched
      with:
        cache: public
        save: true

    - name: Rebuild the site
      if: steps.fetch.outputs.changed == 'true'
      uses: $/.github/actions/rebuild-site
