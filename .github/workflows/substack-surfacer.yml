name: Surface the newsletters' posts from Substack

# The last 90 days' posts of every newsletter Stephen subscribes to on Substack, with their likes and the newsletter's
# free subscribers, for /substack. Substack's Cloudflare turns away GitHub's runners, so like `substack.yml` this
# runs on the self-hosted runner on Stephen's Mac (label mac): it fetches them into data/fetched, saves them to the
# Actions cache, where `site.yml` restores them from, and rebuilds the site. It runs only while the Mac is on; until
# then the site keeps the posts last saved. The Cloudflare Worker in cloudflare/ starts it every three hours, as GitHub's own
# schedule starts runs late or not at all
on:
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    runs-on: [ self-hosted, mac ]
    # It takes under a minute, or longer when Substack rate-limits it
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    concurrency:
      group: substack-surfacer
      cancel-in-progress: false
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Ruby
      uses: $/.github/actions/setup-ruby

    # Fails, saving nothing, if most newsletters do: the site then keeps the posts last saved
    # Signed in as Stephen, it fetches the subscriptions hidden from his profile too
    - name: Fetch the posts
      run: bundle exec rake data:substack_surfacer
      env:
        SUBSTACK_TOKEN: ${{ secrets.SUBSTACK_TOKEN }}

    - name: Save the posts
      uses: $/.github/actions/fetched
      with:
        cache: surfacer
        save: true

    - name: Rebuild the site
      uses: $/.github/actions/rebuild-site
