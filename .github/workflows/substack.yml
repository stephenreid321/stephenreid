name: Fetch from Substack

# Substack's Cloudflare turns away GitHub's runners, so this runs on a self-hosted runner on Stephen's Mac (label
# mac): it fetches the notes and posts into data/fetched and, if they've changed, saves them to the Actions cache,
# where `site.yml` restores them from, and rebuilds the site. It runs only while the Mac is on; until then the site
# keeps the notes and posts last saved. The Cloudflare Worker in cloudflare/ starts it every three hours, as GitHub's
# own schedule starts runs late or not at all
on:
  workflow_dispatch:

permissions: {}

jobs:
  fetch:
    runs-on: [ self-hosted, mac ]
    permissions:
      contents: read
      actions: write
    concurrency:
      group: substack
      cancel-in-progress: false
    steps:
    - name: Git checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # As the last run saved them: the posts keep the bodies fetched before, and they're compared with what's fetched.
    # Paths as in `site.yml`, or the cache won't match
    - name: Restore the notes and posts
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          data/fetched/substack_notes.json
          data/fetched/substack_posts.json
        key: substack-${{ github.run_id }}
        restore-keys: substack-

    # The Mac's own Ruby (rvm, on the runner's PATH), with the gems in the runner's workspace
    - name: Install gems
      run: bundle install --quiet
      env:
        BUNDLE_PATH: vendor/bundle

    - name: Fetch from Substack
      id: fetch
      run: |
        before=$(cat data/fetched/substack_notes.json data/fetched/substack_posts.json 2>/dev/null | shasum)
        bundle exec rake data:substack
        after=$(cat data/fetched/substack_notes.json data/fetched/substack_posts.json | shasum)
        if [ "$before" != "$after" ]; then echo changed=true >> "$GITHUB_OUTPUT"; fi
      env:
        BUNDLE_PATH: vendor/bundle
        SUBSTACK_TOKEN: ${{ secrets.SUBSTACK_TOKEN }}
        SUBSTACK_PUBLICATION_URL: ${{ vars.SUBSTACK_PUBLICATION_URL }}

    - name: Save the notes and posts
      if: steps.fetch.outputs.changed == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          data/fetched/substack_notes.json
          data/fetched/substack_posts.json
        key: substack-${{ github.run_id }}

    - name: Rebuild the site
      if: steps.fetch.outputs.changed == 'true'
      run: gh workflow run site.yml --ref "${GITHUB_REF_NAME}"
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
