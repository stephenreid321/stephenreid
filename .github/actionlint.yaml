# actionlint's config (script/lint runs it on the workflows)
self-hosted-runner:
  # The self-hosted runner on Stephen's Mac (~/actions-runner-stephenreid), which substack.yml, substack-surfacer.yml and
  # goodreads.yml run on
  labels:
    - mac
paths:
  .github/workflows/*.yml:
    ignore:
      # Our composite actions are used as $/.github/actions/<name> (AGENTS.md), which GitHub runs but this actionlint
      # doesn't know yet, and takes for a remote action with no ref
      - 'specifying action "\$/\.github/actions/[\w-]+" in invalid format because ref is missing'
