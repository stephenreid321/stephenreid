---
glob: "app/views/**/*.erb"
EnableDefaultLinters: true
linters:
  # Flags all literal text, for translation, which we don't do
  HardCodedString:
    enabled: false
  # Flags every inline <script> with ERB in it
  ErbSafety:
    enabled: false
  # Forces an autocomplete attribute on every input
  RequireInputAutocomplete:
    enabled: false
  # Only the cops that catch bugs (Lint, Security, end alignment) on the Ruby in templates: style cops' autocorrect
  # doesn't understand ERB
  Rubocop:
    enabled: true
    only:
      - Lint
      - Security
      - Layout/BeginEndAlignment
      - Layout/DefEndAlignment
      - Layout/EndAlignment
    rubocop_config:
      inherit_from:
        - .rubocop.yml
      # Each tag is checked on its own, so a variable set in one tag and used in a later one looks unused
      Lint/UselessAssignment:
        Enabled: false
